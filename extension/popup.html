<!doctype html>
<html><head><meta charset="utf-8">
<style>
body{font-family:system-ui,sans-serif;width:300px;padding:14px;background:#0f0f1a;color:#eee;font-size:13px}
h1{font-size:15px;margin:0 0 10px}
label{display:block;color:#9aa}
input{width:100%;box-sizing:border-box;margin:4px 0 10px;padding:8px;border-radius:8px;border:1px solid #444;background:#1b1b2b;color:#eee}
button{padding:8px 12px;border:0;border-radius:8px;background:#22c55e;color:#04210f;font-weight:600;cursor:pointer;margin-right:6px}
button.alt{background:#2a2a3d;color:#eee}
.muted{color:#9aa}.err{color:#f87171;margin-top:8px;word-break:break-word}
</style></head><body>
<h1>Know Thyself Tracker</h1>
<div id="login" style="display:none">
  <label>Server API</label><input id="api">
  <label>Email</label><input id="email" type="email">
  <label>Password</label><input id="pw" type="password">
  <button id="go">Sign in</button>
</div>
<div id="main" style="display:none">
  <p>Signed in as <b id="who"></b></p>
  <p class="muted" id="now"></p>
  <p class="muted" id="queue"></p>
  <button id="send">Send now</button><button class="alt" id="out">Sign out</button>
</div>
<div class="err" id="err"></div>
<script src="popup.js"></script>
</body></html>
